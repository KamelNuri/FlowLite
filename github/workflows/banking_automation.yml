    {
      "parameters": {
        "jsCode": "const items = $input.all();\n\nconst todayDateStr = \"2026-10-18\";\n\nconst todayItems = items.filter(item => {\n    const data = item.json;\n    const submitted = String(data[\"submittedAt\"] || data[\"timestamp\"] || \"\");\n    const readable = String(data[\"Readable date\"] || \"\");\n    return submitted.includes(todayDateStr) || readable.includes(\"October 18th 2026\");\n});\n\nlet totalRequests = todayItems.length;\n\nlet depositList = [];\nlet depositTotal = 0;\n\nlet withdrawalList = [];\nlet withdrawalTotal = 0;\n\nlet loanList = [];\nlet loanTotal = 0;\n\nlet newUsersList = [];\n\ntodayItems.forEach(item => {\n    const data = item.json;\n    const customerName = data[\"Customer Name\"] || \"Unknown Customer\";\n    \n    const req1 = String(data[\"Customer Request\"] || \"\").toLowerCase();\n    const req2 = String(data[\"Customer Request \"] || \"\").toLowerCase();\n    const notes = String(data[\"Additional Notes\"] || \"\").toLowerCase();\n    const newUserField = String(data[\"Adding New User to the account\"] || \"\").trim();\n\n    const combinedText = `${req1} ${req2} ${notes} ${newUserField}`.toLowerCase();\n\n    const rawAmount = data[\"Amount\"] || 0;\n    const amount = parseFloat(String(rawAmount).replace(/[^0-9.-]+/g, \"\")) || 0;\n\n    if (combinedText.includes(\"deposit\")) {\n        depositList.push(`${customerName} ($${amount.toLocaleString()})`);\n        depositTotal += amount;\n    } \n    if (combinedText.includes(\"withdrawal\") || combinedText.includes(\"withdraw\")) {\n        withdrawalList.push(`${customerName} ($${amount.toLocaleString()})`);\n        withdrawalTotal += amount;\n    } \n    if (combinedText.includes(\"loan\") || combinedText.includes(\"borrow\")) {\n        loanList.push(`${customerName} ($${amount.toLocaleString()})`);\n        loanTotal += amount;\n    } \n    if (combinedText.includes(\"new user\") || combinedText.includes(\"adding new user\") || newUserField !== \"\") {\n        newUsersList.push(customerName);\n    }\n});\n\n// Format with points under points displaying names/details\nconst masterSummary = `\n• Total Operations Processed (${totalRequests})\n\n• Deposit Operations (${depositList.length} - Total: $${depositTotal.toLocaleString()}):\n${depositList.length > 0 ? depositList.map(name => `  - ${name}`).join('\\n') : '  - None'}\n\n• Withdrawal Operations (${withdrawalList.length} - Total: $${withdrawalTotal.toLocaleString()}):\n${withdrawalList.length > 0 ? withdrawalList.map(name => `  - ${name}`).join('\\n') : '  - None'}\n\n• Loan Operations (${loanList.length} - Total: $${loanTotal.toLocaleString()}):\n${loanList.length > 0 ? loanList.map(name => `  - ${name}`).join('\\n') : '  - None'}\n\n• New User Accounts Added (${newUsersList.length}):\n${newUsersList.length > 0 ? newUsersList.map(name => `  - ${name}`).join('\\n') : '  - None'}\n`.trim();\n\nreturn [{ json: { summary: masterSummary } }];"
      },
